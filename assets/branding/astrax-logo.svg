<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="AstraX logo">
<title>AstraX</title>

<defs>
  <radialGradient id="bg" cx="50%" cy="40%" r="75%">
    <stop offset="0" stop-color="#10264d"/><stop offset="0.45" stop-color="#0b1424"/><stop offset="1" stop-color="#05080d"/>
  </radialGradient>
  <radialGradient id="neb1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2aa9ff" stop-opacity="0.22"/><stop offset="1" stop-color="#2aa9ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="neb2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff7a2a" stop-opacity="0.10"/><stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/></radialGradient>
  <radialGradient id="neb3" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6a4cff" stop-opacity="0.12"/><stop offset="1" stop-color="#6a4cff" stop-opacity="0"/></radialGradient>

  <linearGradient id="silL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#c3cfdc"/><stop offset="1" stop-color="#8e9db0"/></linearGradient>
  <linearGradient id="silR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9e2ec"/><stop offset="0.6" stop-color="#8998ab"/><stop offset="1" stop-color="#5d6a7c"/></linearGradient>
  <linearGradient id="bluL" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7fe0ff"/><stop offset="0.55" stop-color="#2aa9ff"/><stop offset="1" stop-color="#1857ff"/></linearGradient>
  <linearGradient id="bluR" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2aa9ff"/><stop offset="0.6" stop-color="#1557e8"/><stop offset="1" stop-color="#0a2b9c"/></linearGradient>

  <linearGradient id="ringG" gradientUnits="userSpaceOnUse" x1="-345" y1="0" x2="345" y2="0">
    <stop offset="0" stop-color="#2aa9ff" stop-opacity="0.15"/><stop offset="0.25" stop-color="#2aa9ff"/>
    <stop offset="0.5" stop-color="#e9f8ff"/><stop offset="0.75" stop-color="#2aa9ff"/><stop offset="1" stop-color="#2aa9ff" stop-opacity="0.15"/>
  </linearGradient>
  <linearGradient id="flameG" gradientUnits="userSpaceOnUse" x1="0" y1="585" x2="0" y2="670">
    <stop offset="0" stop-color="#fff3c4"/><stop offset="0.35" stop-color="#ffb347"/><stop offset="0.7" stop-color="#ff7a2a"/><stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbG" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#9fe6ff"/><stop offset="1" stop-color="#1c7bff"/></radialGradient>
  <radialGradient id="haloG"><stop offset="0" stop-color="#7fe0ff" stop-opacity="0.9"/><stop offset="1" stop-color="#7fe0ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="txtG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9db0c6"/></linearGradient>
  <linearGradient id="txtX" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8fe3ff"/><stop offset="0.6" stop-color="#2aa9ff"/><stop offset="1" stop-color="#1857ff"/></linearGradient>
  <linearGradient id="lineL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2aa9ff" stop-opacity="0"/><stop offset="1" stop-color="#2aa9ff" stop-opacity="0.9"/></linearGradient>
  <linearGradient id="lineR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2aa9ff" stop-opacity="0.9"/><stop offset="1" stop-color="#2aa9ff" stop-opacity="0"/></linearGradient>
  <linearGradient id="sheenG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="shootG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bfe9ff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff"/></linearGradient>

  <filter id="blur16" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="blur6" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>

  <g id="glyphs">
    <polygon points="640,130 508,340 564,340 640,215"/><polygon points="640,130 772,340 716,340 640,215"/><polygon points="508,380 564,380 640,495 640,590"/><polygon points="772,380 716,380 640,495 640,590"/>
  </g>
  <clipPath id="glyphClip">
    <polygon points="640,130 508,340 564,340 640,215"/><polygon points="640,130 772,340 716,340 640,215"/><polygon points="508,380 564,380 640,495 640,590"/><polygon points="772,380 716,380 640,495 640,590"/>
  </clipPath>
</defs>

<g opacity="0.9">
  
  <g><circle cx="640" cy="360" r="292" fill="none" stroke="#2aa9ff" stroke-opacity="0.38" stroke-width="9" stroke-dasharray="1.4 13.5"/></g>
  <circle cx="640" cy="360" r="270" fill="none" stroke="#2aa9ff" stroke-opacity="0.16" stroke-width="1.2"/>
  <g>
    <circle cx="640" cy="360" r="312" fill="none" stroke="#bfe9ff" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="70 1890"/>
    <circle cx="640" cy="360" r="312" fill="none" stroke="#ff7a2a" stroke-opacity="0.8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="26 1934" stroke-dashoffset="-980"/>
  </g>
</g>

<g id="emblem" transform="translate(640,240) scale(0.82) translate(-640,-330)">
  <!-- glow behind glyphs -->
  <g filter="url(#blur16)" fill="#2aa9ff" opacity="0.6"><use href="#glyphs"/></g>

  <!-- back half of orbit + satellite -->
  <g transform="translate(640,360) rotate(-24)"><path d="M -345 0 A 345 86 0 0 1 345 0" fill="none" stroke="#2aa9ff" stroke-width="16" opacity="0.18" filter="url(#blur6)"></path><path d="M -345 0 A 345 86 0 0 1 345 0" fill="none" stroke="url(#ringG)" stroke-width="7" stroke-linecap="round" opacity="0.5"></path></g>

  <!-- X: Λ (silver) over V (blue thrust) -->
  <g>
    <polygon points="640,130 508,340 564,340 640,215" fill="url(#silL)"/>
    <polygon points="640,130 772,340 716,340 640,215" fill="url(#silR)"/>
    <polyline points="508,340 640,130 772,340" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.6" stroke-linejoin="round"/>
    <line x1="640" y1="130" x2="640" y2="215" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
  </g>
  <g>
    <polygon points="508,380 564,380 640,495 640,590" fill="url(#bluL)"/>
    <polygon points="772,380 716,380 640,495 640,590" fill="url(#bluR)"/>
    <polyline points="508,380 640,590 772,380" fill="none" stroke="#bff0ff" stroke-opacity="0.7" stroke-width="1.6" stroke-linejoin="round"/>
    <line x1="640" y1="495" x2="640" y2="590" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  </g>
  <path d="M 624 588 C 630 622, 638 650, 640 668 C 642 650, 650 622, 656 588 Z" fill="url(#flameG)" filter="url(#blur3)"/>
    <path d="M 632 590 C 636 612, 639 626, 640 636 C 641 626, 644 612, 648 590 Z" fill="#fffbe6" opacity="0.95"/>

  <!-- glowing horizon between the two halves -->
  <g>
    <rect x="520" y="358" width="240" height="4" rx="2" fill="#bfe9ff" opacity="0.8" filter="url(#blur3)"/>
    <rect x="560" y="359.4" width="160" height="1.2" fill="#ffffff"/>
  </g>

  <!-- orb (sun) in the counter of the A -->
  <g transform="translate(640,300)"><g>
    <circle r="34" fill="url(#haloG)" opacity="0.8"></circle>
    <circle r="15" fill="url(#orbG)"/>
  </g></g>
  <g transform="translate(640,300)"><path d="M0 -46 L5 -5 L46 0 L5 5 L0 46 L-5 5 L-46 0 L-5 -5 Z" fill="#dff6ff" opacity="0.9"/></g>

  

  <!-- front half of orbit + satellite -->
  <g transform="translate(640,360) rotate(-24)"><path d="M 345 0 A 345 86 0 0 1 -345 0" fill="none" stroke="#2aa9ff" stroke-width="16" opacity="0.35" filter="url(#blur6)"></path><path d="M 345 0 A 345 86 0 0 1 -345 0" fill="none" stroke="url(#ringG)" stroke-width="7" stroke-linecap="round" opacity="1"></path><path d="M 345 0 A 345 86 0 0 1 -345 0" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.8" transform="translate(0,-2)"></path><g transform="translate(213.9,67.1)"><circle r="22" fill="url(#haloG)"/><circle r="6.5" fill="#ffffff"/><circle r="3" fill="#aeeaff"/></g></g>
  
</g>
