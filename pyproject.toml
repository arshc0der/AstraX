[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrax"
version = "4.0.0"
description = "Open-source spaceflight simulation laboratory: design rockets, fly 3D launches, test survival, plan transfers, analyse orbits."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Arsh" }]
keywords = ["spaceflight", "rocket", "orbital-mechanics", "n-body", "simulation", "aerospace", "pyqt6", "opengl", "education"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Education",
]
dependencies = [
  "PyQt6>=6.5",
  "pyqtgraph>=0.13.3",
  "numpy>=1.24",
  "PyOpenGL>=3.1.10",
  "Pillow>=10.0",
]

[project.optional-dependencies]
report = ["matplotlib>=3.7"]
dev = ["ruff>=0.5", "pre-commit>=3.5", "matplotlib>=3.7"]
build = ["pyinstaller>=6.0"]
branding = ["playwright>=1.40"]
all = ["astrax[report,dev,build,branding]"]

[project.urls]
Homepage = "https://github.com/arshc0der/AstraX"
Documentation = "https://github.com/arshc0der/AstraX/tree/main/docs"
Issues = "https://github.com/arshc0der/AstraX/issues"
Changelog = "https://github.com/arshc0der/AstraX/blob/main/CHANGELOG.md"

[project.scripts]
astrax = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["astrax*", "ui*"]

# The code base uses a compact style (several statements per line); lint only for real errors.
[tool.ruff]
line-length = 220
target-version = "py310"
extend-exclude = ["legacy", "Testing", "venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F821", "F823", "F811"]
