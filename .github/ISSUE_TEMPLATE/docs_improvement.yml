name: Documentation improvement
description: Something is missing, unclear or wrong in the docs
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes: { label: Page or file, placeholder: "docs/TUTORIALS.md" }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: What is wrong or missing? }
    validations: { required: true }
  - type: textarea
    id: suggestion
    attributes: { label: Suggested text or fix }
